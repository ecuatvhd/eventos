<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECUTVHD</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .video-wrapper {
    position: relative;
    width: 80%;
    padding-top: 18.75%; /* 16:3 */
    background: black;
  }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<div class="video-wrapper">
  <iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const channel = params.get("channel");
  const r = params.get("r");

  if (channel) {
    // Construir la URL del backend con el canal en claro
    const backendUrl = `https://ecuatvhd.github.io/eventos/player3.html?channel=${channel}`;

    // Codificar esa URL completa en Base64
    const encodedBackendUrl = btoa(backendUrl);

    // Redirigir automáticamente a la versión con ?r=...
    const newUrl = `${window.location.origin}${window.location.pathname}?r=${encodedBackendUrl}`;
    window.location.replace(newUrl);
  } else if (r) {
    // Decodificar la URL completa y asignarla al iframe
    const decodedUrl = atob(r);
    document.getElementById("player").src = decodedUrl;
  }
</script>


<!---decode-->
<script>
    function getDecodedChannel() {
      const params = new URLSearchParams(window.location.search);
      const r = params.get("r");
      if (r) {
        return atob(r); // ej: "channel=premier2uk"
      }
      return null;
    }

    const channelParam = getDecodedChannel();
    if (channelParam) {
      // Cargar play.html con el parámetro decodificado
      document.getElementById("player2").src = "/eventos/play.html?" + channelParam;
    } else {
      document.body.innerHTML = "<p>Error: no se encontró parámetro de canal.</p>";
    }
  </script>
