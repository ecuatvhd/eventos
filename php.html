<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; }
    iframe { width:100%; height:100%; border:none; }
  </style>
</head>
<body>
  <iframe id="player" allowfullscreen
          sandbox="allow-scripts allow-same-origin">
  </iframe>

  <script>
async function loadChannel() {
  const params = new URLSearchParams(window.location.search);
  const canal = params.get("channel"); // ahora lee ?channel=
  if (!canal) return;

  // Cargar JSON
  const res = await fetch("/eventos/php.json?v=" + Date.now());
  const channels = await res.json();

  // Buscar canal por id
  const ch = channels.find(c => c.id.toLowerCase() === canal.toLowerCase());
  if (!ch) return;

  // Convertir URL a Base64
  const base64Url = btoa(ch.url);

  // Redirigir automáticamente a eventos.html?r=...
  window.location.href = "eventos.html?r=" + base64Url;
}
loadChannel();
</script>


</body>
</html>
