<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; }
    iframe { width:100%; height:100%; border:none; }
  </style>
</head>
<body>
  <iframe id="player" allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-presentation">
  </iframe>

  <script>
    async function loadChannel() {
      const params = new URLSearchParams(window.location.search);
      const canal = params.get("canales");
      if (!canal) return;

      // Cargar JSON
      const res = await fetch("php.json?v=" + Date.now());
      const channels = await res.json();

      // Buscar canal
      const ch = channels.find(c => c.id.toLowerCase() === canal.toLowerCase());
      if (!ch) {
        document.body.innerHTML = "<p style='color:white;text-align:center;'>Canal no encontrado</p>";
        return;
      }

      // Convertir URL a Base64
      const base64Url = btoa(ch.url);

      // Decodificar y reproducir directamente
      const decodedUrl = atob(base64Url);
      document.getElementById("player").src = decodedUrl;
    }

    loadChannel();
  </script>
</body>
</html>
