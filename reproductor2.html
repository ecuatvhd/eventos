<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecuatvhdplay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .video-wrapper {
    position: relative;
    width: 80%;
    padding-top: 18.75%; /* 16:3 */
    background: black;
  }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .logo {
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--neon-green);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(0,255,65,0.55);
  }
  .logo-icon::after { content: '▶'; color: var(--dark-bg); font-size: 14px; margin-left: 2px; }

  .logo h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem; letter-spacing: 3px;
    color: var(--text-primary); line-height: 1;
    text-shadow: 0 0 16px rgba(0,255,65,0.25);
  }
  .logo h2 span { color: var(--neon-green); }
</style>
</head>
  <header class="site-header">
  <div class="header-inner">
    <a href="/ecuatv/agenda.html" class="logo">
      <div class="logo-icon"></div>
      <h2>ECUTV<span>TV</span>HD</h2>
    </a>
  </div>
</header>

<body>

<div class="video-wrapper">
  <iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const channel = params.get("channel");
  const r = params.get("r");

  if (channel) {
    // Construir la URL del backend con el canal en claro
    const backendUrl = `https://ecuatvhd.github.io/eventos/reproductor.html?channel=${channel}`;

    // Codificar esa URL completa en Base64
    const encodedBackendUrl = btoa(backendUrl);

    // Redirigir automáticamente a la versión con ?r=...
    const newUrl = `${window.location.origin}${window.location.pathname}?r=${encodedBackendUrl}`;
    window.location.replace(newUrl);
  } else if (r) {
    // Decodificar la URL completa y asignarla al iframe
    const decodedUrl = atob(r);
    document.getElementById("player").src = decodedUrl;
  }
</script>

</body>
</html>
