<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reproductor</title>
  <link rel="stylesheet" href="https://cdn.bitmovin.com/player/web/8/bitmovinplayer-ui.css" />
  <script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    #player-wrap {
      width: 100%; height: 100%;
      position: relative;
    }

    #player {
      width: 100%; height: 100%;
    }

    /* ── object-fit: fill en todos los estados ─────────────────────────── */
    /* Normal */
    #player video,
    .bitmovinplayer-container video {
      object-fit: fill !important;
    }

    /* Pantalla completa — todos los navegadores */
    :fullscreen video,
    :fullscreen .bitmovinplayer-container video,
    :-webkit-full-screen video,
    :-webkit-full-screen .bitmovinplayer-container video,
    :-moz-full-screen video,
    :-moz-full-screen .bitmovinplayer-container video,
    :-ms-fullscreen video,
    :-ms-fullscreen .bitmovinplayer-container video {
      object-fit: fill !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Bitmovin marca el contenedor con data-fullscreen=true */
    [data-fullscreen="true"] video,
    [data-legacy-fullscreen="true"] video {
      object-fit: fill !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Overlay de carga ──────────────────────────────────────────────── */
    #overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      transition: opacity 0.5s;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .channel-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #18c5a3;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #msg {
      font-size: 0.8rem;
      color: #555;
      max-width: 340px;
      text-align: center;
      line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #msg.error { color: #e05555; }

    /* ── Botón tap-to-play (cuando autoplay queda bloqueado) ───────────── */
    #tap-play {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 40;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      cursor: pointer;
    }
    #tap-play.show { display: flex; }
    #tap-play-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    #tap-play-btn svg { width: 34px; height: 34px; fill: #fff; margin-left: 5px; }
  </style>
</head>
<body>

  <div id="player-wrap">
    <div id="player"></div>

    <!-- Overlay carga -->
    <div id="overlay">
      <div class="spinner" id="spinner"></div>
      <div class="channel-name" id="channelName">Cargando…</div>
      <div id="msg"></div>
    </div>

    <!-- Tap to play (si el navegador bloquea autoplay) -->
    <div id="tap-play" onclick="startPlay()">
      <div id="tap-play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
  </div>

  <script>
    // ─── CONFIGURACIÓN ────────────────────────────────────────────────────────
    var CHANNELS_JSON_URL = 'https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/channels.json';
    var BITMOVIN_KEY      = '11d3698c-efdf-42f1-8769-54663995de2b';
    // ─────────────────────────────────────────────────────────────────────────

    // Bypass de licencia Bitmovin
    (function () {
      var fake = 'data:text/plain;charset=utf-8;base64,eyJzdGF0dXMiOiJncmFudGVkIiwibWVzc2FnZSI6IlRoZXJlIHlvdSBnby4ifQ==';
      var _open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function () {
        if ((arguments[1] || '').indexOf('licensing.bitmovin.com') > -1) arguments[1] = fake;
        return _open.apply(this, arguments);
      };
    })();

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function toBase64(obj) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function fromBase64(str) {
      return JSON.parse(decodeURIComponent(escape(atob(str))));
    }
    function setOverlay(title, detail, isError) {
      document.getElementById('channelName').textContent = title || '';
      var msgEl = document.getElementById('msg');
      msgEl.textContent = detail || '';
      msgEl.className = isError ? 'error' : '';
      if (isError) document.getElementById('spinner').style.display = 'none';
    }
    function hideOverlay() {
      document.getElementById('overlay').classList.add('hidden');
    }

    // Forzar object-fit:fill en el elemento <video> del player
    function patchVideoFill() {
      var vids = document.querySelectorAll('#player video, .bitmovinplayer-container video');
      vids.forEach(function (v) { v.style.setProperty('object-fit', 'fill', 'important'); });
    }

    // ─── Player global (para tap-to-play) ────────────────────────────────────
    var _player = null;

    function startPlay() {
      document.getElementById('tap-play').classList.remove('show');
      if (_player) {
        _player.setVolume(100);
        _player.play().catch(function () {});
      }
    }

    // ─── Reproducir ───────────────────────────────────────────────────────────
    function play(channelData) {
      // Convertir a ?r=BASE64 en la URL
      var b64 = toBase64(channelData);
      if (getParam('r') !== b64) {
        window.history.replaceState(null, '', window.location.pathname + '?r=' + b64);
      }

      document.title = channelData.name || 'Reproductor';
      setOverlay(channelData.name || 'Stream', 'Conectando…');

      var config = {
        key: BITMOVIN_KEY,
        playback: {
          autoplay: true,
          muted: true        // muted=true garantiza que el autoplay funcione en todos los navegadores
        },
        style: { width: '100%', height: '100%' }
      };

      var source = { dash: channelData.dash };
      if (channelData.keyId && channelData.key) {
        source.drm = {
          clearkey: [{ keyId: channelData.keyId, key: channelData.key }]
        };
      }

      _player = new bitmovin.player.Player(document.getElementById('player'), config);

      _player.load(source).then(function () {
        hideOverlay();
        patchVideoFill();

        // Intentar unmute — si el navegador lo permite, hay audio desde el inicio
        _player.setVolume(100);
        var playPromise = _player.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {
            // Autoplay bloqueado: mostrar botón tap-to-play
            document.getElementById('tap-play').classList.add('show');
          });
        }

        // Re-aplicar fill al entrar/salir de pantalla completa
        document.addEventListener('fullscreenchange', patchVideoFill);
        document.addEventListener('webkitfullscreenchange', patchVideoFill);
      }).catch(function (err) {
        setOverlay(
          channelData.name || 'Error',
          'No se pudo cargar: ' + (err.message || err.code || JSON.stringify(err)),
          true
        );
      });
    }

    // ─── Inicio ───────────────────────────────────────────────────────────────
    (async function () {
      var r       = getParam('r');
      var channel = getParam('channel');

      if (r) {
        try {
          var data = fromBase64(r);
          if (data && data.dash) { play(data); return; }
        } catch (e) {
          setOverlay('Error', 'Parámetro ?r= inválido.', true);
          return;
        }
      }

      if (channel) {
        setOverlay('Cargando canal…', 'Obteniendo configuración…');
        try {
          var resp = await fetch(CHANNELS_JSON_URL, { cache: 'no-store' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var channels = await resp.json();
          var ch = channels[channel.toLowerCase()];
          if (!ch) {
            setOverlay('Canal no encontrado', '"' + channel + '" no existe en el JSON.', true);
            return;
          }
          play(ch);
        } catch (e) {
          setOverlay('Error', 'No se pudo leer el JSON: ' + e.message, true);
        }
        return;
      }

      setOverlay('Sin canal', 'Usá ?channel=tyc  o  ?r=BASE64 en la URL.', true);
    })();
  </script>

</body>
</html>
