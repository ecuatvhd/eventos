<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor Stream</title>
  <style>
    body { margin:0; background:#000; }
    #player { width:100%; height:100vh; border:none; }
  </style>
</head>
<body>
  <iframe id="player" allowfullscreen></iframe>

  <script>
    // Decodificar el parámetro r
    function getDecodedStream() {
      const params = new URLSearchParams(window.location.search);
      const r = params.get("r");
      if (r) {
        try {
          return atob(r); // ej: "stream=ecdf_ligapro"
        } catch(e) {
          return null;
        }
      }
      return null;
    }

    const streamParam = getDecodedStream();
    if (streamParam && streamParam.startsWith("stream=")) {
      // Construir la URL final
      const url = "https://tvtvhd.com/canales.php?" + streamParam;
      document.getElementById("player").src = url;
    } else {
      document.body.innerHTML = "<p style='color:white;text-align:center;'>Error: no se encontró stream.</p>";
    }
  </script>
</body>
</html>
