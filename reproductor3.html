<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor3</title>
  <style>
    body { margin:0; background:#000; }
    #player { width:100%; height:100vh; border:none; }
  </style>
</head>
<body>
  <iframe id="player" allowfullscreen></iframe>

  <script>
    // Leer el parámetro stream
    const params = new URLSearchParams(window.location.search);
    const stream = params.get("stream");

    if (stream) {
      // Codificar en Base64 el parámetro completo "stream=..."
      const encoded = btoa("stream=" + stream);

      // Construir la URL final con ?r=
      const url = "https://tvtvhd.com/canales.php?" + atob(encoded);

      // Cargar en el iframe
      document.getElementById("player").src = url;

      // Opcional: mostrar en consola la codificación
      console.log("Base64:", encoded);
    } else {
      document.body.innerHTML = "<p style='color:white;text-align:center;'>Error: no se encontró parámetro stream.</p>";
    }
  </script>
</body>
</html>
